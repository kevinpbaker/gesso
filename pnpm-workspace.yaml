packages:
  - 'packages/*'
  - 'apps/*'
  # `create-gesso-app` is a tool this repository runs, not a package it
  # links: it has no dependencies, nothing imports it, and it is invoked
  # with `node` from a root script the way everything in `scripts/` is.
  # Listing it as an importer would put an entry in the lockfile that
  # buys nothing, and CI installs with `--frozen-lockfile`.
  - '!packages/create-gesso-app'
  # `apps/desk` is an Electrobun application, and Hutch installs its
  # dependencies and projects the Electrobun devkit into it. Listing it
  # here would put pnpm and Hutch in charge of the same `node_modules`,
  # and CI installs with `--frozen-lockfile`. It resolves the framework
  # by source through its own Vite config, as an application inside the
  # repository that builds it has to.
  - '!apps/desk'
