# Publishing the seven packages.
#
# The shape of this file is decided by one conflict. The packages'
# `exports` point at `src/*.ts` so the workspace and the documentation
# site resolve the framework from source, and `publishConfig.exports` is
# what rewrites them to `dist` at publish time: a pnpm feature that npm
# does not implement. But npm's trusted publishing and provenance are
# npm CLI features that pnpm does not implement
# (https://github.com/pnpm/pnpm/issues/9812). Publishing with either one
# alone gives up something that matters.
#
# So each half does what only it can: **pnpm packs**, applying the
# rewrite, and **npm publishes the tarball**, which reads the manifest
# from inside it. Provenance and OIDC come from the npm side; the
# correct manifest comes from the pnpm side.
#
# See RELEASING.md for the version policy and for publishing by hand.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Pack and check, but do not publish'
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

env:
  # Trusted publishing needs npm >= 11.5.1, which wants a recent Node.
  NODE_VERSION: '24'

jobs:
  # The commit being published has to have passed CI already: every job in
  # ci.yml, on this exact commit, in its latest attempt. This job waits for
  # that run rather than repeating it.
  #
  # It used to rerun `pnpm check` and `pnpm check:install` here. That
  # proved nothing CI had not, and doubled the chances of a shared runner
  # being too slow for a browser to start: v0.6.1 failed twice in this
  # workflow on a commit whose CI was green. The guarantee is the same one
  # as before, "the gates passed on what is tagged", read from the run
  # that already established it.
  #
  # A tag on a commit CI never ran (one not pushed to main or a pull
  # request), or whose run was cancelled by a later push, fails here with
  # what to do about it. Push the commit, or rerun its CI, then rerun this.
  ci:
    name: CI passed on this commit
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    timeout-minutes: 90
    steps:
      - name: Wait for CI on ${{ github.sha }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + 80 * 60 ))
          while :; do
            # Newest CI run for the commit; a rerun updates its conclusion in place.
            run=$(gh run list --workflow ci.yml --commit "$SHA" --limit 1 \
              --json databaseId,status,conclusion,url \
              -q '.[0] // empty | "\(.databaseId) \(.status) \(.conclusion) \(.url)"')
            if [ -z "$run" ]; then
              echo "::error::CI has not run on $SHA. Push it to main or open a pull request, let CI pass, then rerun this workflow."
              exit 1
            fi
            read -r id status conclusion url <<< "$run"
            if [ "$status" = "completed" ]; then
              if [ "$conclusion" = "success" ]; then
                echo "CI passed on $SHA: $url"
                exit 0
              fi
              echo "::error::CI on $SHA finished as '$conclusion': $url. Rerun its failed jobs; once it is green, rerun this workflow."
              exit 1
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::CI on $SHA was still $status after 80 minutes: $url"
              exit 1
            fi
            echo "CI on $SHA is $status; waiting. $url"
            sleep 30
          done

  publish:
    name: publish to npm
    needs: [ci]
    runs-on: ubuntu-latest
    permissions:
      # The OIDC token npm exchanges for a short-lived publish credential,
      # and the same token provenance is attested with. Without this line
      # the publish falls back to NPM_TOKEN and ships no provenance.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      # Trusted publishing is refused by older clients with a message that
      # does not say so. Pin the floor rather than trust the image.
      - name: npm new enough for trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - run: pnpm --filter './packages/*' build

      # pnpm's half: `publishConfig.exports` is applied here and nowhere
      # else. Every tarball is verified to declare `dist` before anything
      # is uploaded, because the failure this catches is invisible until
      # somebody installs the package.
      - name: Pack, and prove the manifests were rewritten
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tarballs"
          for dir in packages/*/; do
            name=$(node -p "require('./$dir/package.json').name")
            private=$(node -p "require('./$dir/package.json').private === true")
            [ "$private" = "true" ] && { echo "skipping $name (private)"; continue; }

            # The seven libraries declare `publishConfig.exports`, which is
            # the rewrite this step exists to prove happened. A package
            # without one has no rewrite to verify and is not part of a
            # release here: `create-gesso-app` is a CLI with a `bin` and no
            # `exports` at all, and RELEASING.md publishes it by hand and
            # afterwards, because it vendors packages it cannot name before
            # they exist. Reading its missing `exports` is what failed the
            # first 0.2.0 release.
            rewrites=$(node -p "Boolean(require('./$dir/package.json').publishConfig?.exports)")
            [ "$rewrites" = "true" ] || { echo "skipping $name (no publishConfig.exports; not a library)"; continue; }

            (cd "$dir" && pnpm pack --out "$RUNNER_TEMP/tarballs/$name.tgz")

            entry=$(tar -xzOf "$RUNNER_TEMP/tarballs/$name.tgz" package/package.json \
              | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{
                  const e=JSON.parse(s).exports['.'];
                  process.stdout.write(typeof e==='string'?e:e.default);
                })")
            case "$entry" in
              ./dist/*) echo "ok   $name -> $entry" ;;
              *) echo "REFUSING: $name packed with exports '$entry', not ./dist/*." >&2
                 echo "publishConfig.exports was not applied. Do not publish this." >&2
                 exit 1 ;;
            esac
          done

      # npm's half: the upload, the OIDC exchange and the provenance
      # attestation. Publishing a tarball reads the manifest from inside
      # it, so what pnpm rewrote is what the registry receives.
      - name: Publish
        if: github.event_name == 'push' || inputs.dry-run == false
        run: |
          set -euo pipefail
          for tgz in "$RUNNER_TEMP"/tarballs/*.tgz; do
            echo "publishing $(basename "$tgz")"
            npm publish "$tgz" --provenance --access public
          done
        env:
          # Only used until a trusted publisher is configured for each
          # package on npmjs.com. Once that is done this secret can be
          # deleted and the token revoked: OIDC needs no stored
          # credential. RELEASING.md has the steps.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: What a dry run would have sent
        if: github.event_name == 'workflow_dispatch' && inputs.dry-run
        run: ls -la "$RUNNER_TEMP/tarballs"
