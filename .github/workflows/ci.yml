# Continuous integration.
#
# Before this file there was no CI in the repository at all: every gate
# the earlier milestones claim (layout conformance, the performance
# budgets, renderer parity) was a command someone remembered to type.
#
# The jobs are split by what they need. `checks` needs nothing but Node.
# `install`, `scaffold`, `parity` and `accessibility` need a browser,
# and the runner images ship Google Chrome. `text` needs a browser and
# the seven Noto faces the text fixtures were rendered in, which apt
# provides. `screenshots` and `docs-screenshots` need a browser *and*
# baselines captured in the same environment, which is why they are the
# two jobs here that cannot yet be authoritative.
#
# `pnpm check` runs the `checks` job's steps locally in the same order.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The scripts run TypeScript directly through Node's type stripping.
  NODE_VERSION: '24'

jobs:
  checks:
    name: format, lint, types, tests, build, API report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Formatting
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Types
        run: pnpm exec tsc --noEmit

      # Layout conformance (L0) and the performance budgets (L7) are
      # vitest specs with committed artifacts, so this one command is
      # three of the gates in one command.
      - name: Tests, layout conformance and performance budgets
        run: pnpm test:run

      - name: Build the packages and the playground
        run: pnpm build
      - name: Public API report
        run: pnpm api:check

      # The docs site: every live example has a worker and every snippet
      # region exists, the generated reference page matches the source,
      # the site's own TypeScript checks, and VitePress builds it.
      - name: Docs gate
        run: pnpm docs:check
      - name: Docs reference page matches the source
        run: pnpm docs:reference:check
      - name: Docs types
        run: pnpm typecheck:docs
      - name: Docs build
        run: pnpm docs:build

  text:
    name: text conformance against a fresh Chrome
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The faces the fixtures were rendered in, at the paths
      # packages/core/src/layout/textConformance/fonts.ts looks for on
      # Debian and Ubuntu. A different release of a face can move a
      # glyph's advance; if that happens the check names the case and
      # the fix is a regeneration on a machine with the same faces.
      - name: Noto faces
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-core fonts-noto-cjk fonts-noto-color-emoji

      # Ubuntu's fonts-noto-core carries an older Noto Sans Devanagari
      # than the fixtures were rendered in, and its advances differ by up
      # to 1.4px across four Hindi cases, which is more than the 0.1px
      # tolerance. Rather than loosen the cases, the check gets the
      # exact release the fixtures record: the hinted 2.006 build,
      # verified against the sha256 in expected.json's generator block
      # so a moved or re-cut upstream asset fails here and not as a
      # confusing layout diff. The other six apt faces agree within
      # tolerance, so they stay as they are.
      - name: Noto Sans Devanagari 2.006, the release the fixtures were rendered in
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/noto-devanagari"
          mkdir -p "$dir"
          curl -sSL -o "$dir/release.zip" \
            https://github.com/notofonts/devanagari/releases/download/NotoSansDevanagari-v2.006/NotoSansDevanagari-v2.006.zip
          unzip -qo "$dir/release.zip" 'NotoSansDevanagari/hinted/ttf/NotoSansDevanagari-Regular.ttf' -d "$dir"
          file="$dir/NotoSansDevanagari/hinted/ttf/NotoSansDevanagari-Regular.ttf"
          echo "306b53ecfb182a504dd8a7446093c316387d2fd8dc350d0792ed1753fe0996cd  $file" | sha256sum -c -
          echo "GESSO_FONT_DEVANAGARI=$file" >> "$GITHUB_ENV"

      # Renders every paragraph the way `pnpm fixtures:text` does and
      # fails if Chrome's lines, box or baseline for any case have moved
      # from the committed expectations by more than the case's
      # tolerance. The replay half of the harness runs in `checks` as a
      # vitest spec; this is the half that needs a browser.
      - name: Text fixtures still match Chrome
        run: pnpm fixtures:text:check
        env:
          CHROME_BIN: google-chrome

  scaffold:
    name: create-gesso-app scaffolds a working app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Runs the CLI into a temporary directory, installs the result with
      # npm, typechecks and builds it, then drives its dev server in
      # Chrome until the counter counts. What it checks is the template
      # and the CLI, not a committed example.
      - name: Scaffold check
        run: pnpm check:scaffold
        env:
          CHROME_BIN: google-chrome

  install:
    name: packed packages install, test and run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Packs the four packages, installs the tarballs into a fresh Vite
      # project with npm, typechecks it against the published
      # declarations, runs a component test through the published
      # `gesso-testing`, builds it and drives it in Chrome. Compares no
      # pixels, so it is environment-independent.
      - name: Install check
        run: pnpm check:install
        env:
          CHROME_BIN: google-chrome

  parity:
    name: Canvas2D and WebGPU agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # WebGPU on a machine with no GPU is Dawn on Vulkan on SwiftShader,
      # which needs the Vulkan loader present. The script fails rather
      # than passes when no adapter turns up, so a missing library here
      # is reported and not skipped.
      - name: Vulkan loader for SwiftShader
        run: sudo apt-get update && sudo apt-get install -y libvulkan1 mesa-vulkan-drivers

      # Compares the compare route's two panes against each other in one
      # run, so it needs no baseline and is environment-independent.
      - name: Renderer parity
        run: pnpm parity:webgpu
        env:
          CHROME_BIN: google-chrome

  accessibility:
    name: the accessibility mirror is readable and operable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Reads Chrome's own computed accessibility tree for two example
      # routes and presses a control the way an assistive technology
      # does. It compares no pixels and needs no baseline, so unlike the
      # screenshot job it is authoritative here. What it cannot do is
      # run VoiceOver or NVDA, so what a screen reader announces is not
      # covered here.
      - name: Accessibility mirror
        run: pnpm check:a11y
        env:
          CHROME_BIN: google-chrome

  screenshots:
    name: route screenshots (advisory until baselines are captured here)
    runs-on: ubuntu-latest
    # Not authoritative yet, and deliberately not pretending to be. The
    # baselines committed in apps/playground/screenshots were captured on
    # a developer machine, and canvas text is rasterised with the system's
    # fonts, so they are not comparable with this runner's output. The
    # script says so and fails rather than comparing anyway. To promote
    # this job to a gate: run `pnpm screenshots:update` in this
    # environment, commit the baselines and the manifest, and delete this
    # line.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Vulkan loader for SwiftShader
        run: sudo apt-get update && sudo apt-get install -y libvulkan1 mesa-vulkan-drivers

      - name: Route screenshots
        run: pnpm screenshots
        env:
          CHROME_BIN: google-chrome

      # What a reviewer needs to see when a route's rendering changes.
      - name: Upload the captures that differed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: route-screenshots
          path: apps/playground/screenshots/*.actual.png
          if-no-files-found: ignore

  docs-screenshots:
    name: docs screenshots (advisory until baselines are captured here)
    runs-on: ubuntu-latest
    # Advisory for exactly the reason the route job above is, and no
    # other. The baselines committed in apps/docs/screenshots were
    # captured on a developer machine; canvas text is rasterised by the
    # browser with the system's fonts, so a runner with different faces
    # draws different pixels and the two sets are not comparable. The
    # script refuses to compare across that mismatch rather than
    # reporting a meaningless diff, so this job would fail on its
    # manifest check every run. To promote it to a gate: run
    # `pnpm docs:screenshots:update` in this environment, commit
    # apps/docs/screenshots and its manifest.json, and delete this line.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Builds the docs site, serves it, and opens every page carrying a
      # live example in still mode. No Vulkan loader: the docs examples
      # are Canvas2D, which is the framework's default backend, and the
      # site offers no renderer switch.
      - name: Docs screenshots
        run: pnpm docs:screenshots
        env:
          CHROME_BIN: google-chrome

      # What a reviewer needs to see when a page's canvas changes.
      - name: Upload the captures that differed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docs-screenshots
          path: apps/docs/screenshots/*.actual.png
          if-no-files-found: ignore
