name: Bug report
description: Something renders, measures or behaves differently from what it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Gesso draws into a canvas, so there is no element to inspect and
        no stylesheet to read. A screenshot cannot be bisected and "the
        box is the wrong size" cannot be run. A `renderTest` can be, and
        that is the difference between a report that is fixed this week
        and one that waits for somebody to guess what you meant.

  - type: textarea
    id: what
    attributes:
      label: What happens, and what should happen instead
      placeholder: |
        The button's label sits two pixels above the centre of its box.
        It should be centred, and it is in a Row with the same props.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: A reproduction
      description: |
        A `renderTest` is worth more than anything else you can give us.
        It needs no browser and runs in the suite, so it becomes the
        regression test for the fix.

        If the bug only appears on screen — a paint, a gesture, a
        transition — then a minimal route or a link to a repository is
        fine, and say so below.
      render: typescript
      value: |
        import { renderTest } from 'gesso-testing';
        import 'gesso-testing/matchers';
        import { createComponent } from 'gesso-framework';

        it('centres the label', () => {
          const ui = renderTest(createComponent(Button, { label: 'Retry' }));

          expect(ui.getByText('Retry')).toHaveBox({ y: 12 });
          // got 10
        });
    validations:
      required: true

  - type: dropdown
    id: renderer
    attributes:
      label: Which renderer
      options:
        - Canvas2D
        - WebGPU
        - Both
        - Not a rendering bug / do not know
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: The version of the gesso-* packages. `npm ls gesso-core` answers it.
      placeholder: '0.1.0'
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Browser and OS
      description: |
        Or the runtime, if this is a desktop application: WebKitGTK,
        WKWebView or WebView2.
      placeholder: 'Chrome 153, Linux'
    validations:
      required: true

  - type: textarea
    id: explain
    attributes:
      label: What the engine says
      description: |
        Optional, and often decisive for anything about size or position.
        `engine.explain(node)` answers why a box is the size it is, in
        the order the rules applied. `ui.debug()` prints the tree.
      render: text
