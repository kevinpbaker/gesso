<svg xmlns="http://www.w3.org/2000/svg" width="414" height="360" viewBox="0 0 414 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1418"/>
      <stop offset="100%" stop-color="#101d22"/>
    </linearGradient>
    <clipPath id="frame2"><rect width="414" height="360"/></clipPath>
  </defs>
  <g clip-path="url(#frame2)">
    <rect width="414" height="360" fill="url(#bg)"/>
    <!-- concentric arcs from the lower left: a sound field -->
    <g fill="none" stroke-linecap="round">
      <circle cx="78" cy="300" r="54"  stroke="#2fb89a" stroke-width="10"/>
      <circle cx="78" cy="300" r="88"  stroke="#2fb89a" stroke-width="7" opacity="0.8"/>
      <circle cx="78" cy="300" r="124" stroke="#33a0b5" stroke-width="6" opacity="0.65"/>
      <circle cx="78" cy="300" r="164" stroke="#3f7fbf" stroke-width="5" opacity="0.5"/>
      <circle cx="78" cy="300" r="208" stroke="#4d63c4" stroke-width="4" opacity="0.38"/>
      <circle cx="78" cy="300" r="256" stroke="#5b4bc0" stroke-width="3" opacity="0.26"/>
    </g>
    <!-- a hard diagonal, cutting the field -->
    <path d="M414 0 L414 360 L196 360 Z" fill="#e8615f" opacity="0.92"/>
    <path d="M414 0 L414 88 L358 0 Z" fill="#f4b03f"/>
    <!-- the disc -->
    <circle cx="300" cy="118" r="40" fill="#0d1418"/>
    <circle cx="300" cy="118" r="40" fill="none" stroke="#f0ede6" stroke-width="3"/>
    <circle cx="300" cy="118" r="7"  fill="#f0ede6"/>
  </g>
</svg>
